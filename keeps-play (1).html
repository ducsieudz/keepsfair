<style>

ox-shadow:8px 9px 0 #d7d5c6;transform:rotate(8deg);padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center}.frameface{width:128px;height:114px;background:var(--yellow);border:1px solid var(--ink);display:grid;place-items:center;font-size:57px;border-radius:60px 60px 7px 7px}.frame small{font-weight:800;margin-top:14px;font-size:10px;letter-spacing:2px}.sticker{position:absolute;font-size:12px;font-weight:800;padding:10px 16px;border:1.5px solid var(--ink);border-radius:30px;background:var(--white);transform:rotate(-10deg);left:4%;top:28px;z-index:1}.sticker.two{left:auto;right:0;top:auto;bottom:24px;transform:rotate(6deg);background:var(--orange);color:white}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mode{border:1.5px solid var(--ink);border-radius:19px;background:var(--white);padding:24px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;color:var(--ink);transition:transform .18s,box-shadow .18s;box-shadow:0 4px 0 var(--ink)}.mode:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}.mode.green{background:var(--green);color:var(--white)}.mode .meta{font-size:11px;letter-spacing:1px;margin:18px 0 8px;font-weight:700;text-transform:uppercase}.mode p{font-size:14px;margin-bottom:20px;opacity:.8;flex:1}.mode .cta{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:800}.emoji{font-size:30px}.arrow{border:1px solid currentColor;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;font-size:20px}.footline{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:11px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}.play{max-width:620px;margin:auto}.playhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:12px;font-weight:700}.textbtn{padding:8px 0;border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:4px}.tag{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:5px 12px;font-size:11px;font-weight:700;background:var(--white)}.progress{height:5px;background:#e0e0d3;border-radius:20px;margin-bottom:28px;overflow:hidden}.progress i{display:block;height:100%;background:var(--orange);transition:width .3s}.panel{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:27px;margin-bottom:20px}.question{margin:18px 0 25px}.answers{display:grid;gap:10px}.answer{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);border-radius:13px;min-height:59px;padding:12px 15px;background:var(--white);color:var(--ink);font-size:15px}.letter{font-size:12px;display:grid;place-items:center;flex-shrink:0;width:29px;height:29px;background:#eeeee5;border-radius:8px;font-weight:800}.answer:hover:enabled{border-color:var(--green);background:#f0f3e9}.answer.right{border-color:var(--green);background:#e8f1e6}.answer.wrong{border-color:#ae4935;background:#faeae5}.answer.chosen{border-color:var(--orange);background:#fff0e7}.answer:disabled{color:var(--ink);opacity:1}.feedback{margin-top:18px;border-radius:13px;background:#edf2e7;padding:16px;font-size:14px}.feedback.bad{background:#faeae5}.feedback p{margin:6px 0 0}.primary,.secondary{width:100%;border:1.5px solid var(--ink);border-radius:12px;min-height:53px;padding:14px 18px;font-weight:800;background:var(--orange);color:white;box-shadow:0 3px 0 var(--ink);margin-top:12px}.secondary{background:var(--white);color:var(--ink);box-shadow:none}.primary:disabled{background:#888b7b}.buttonrow{display:flex;gap:10px}.center{text-align:center}.bigscore{font-size:92px;font-weight:900;line-height:1.1;letter-spacing:-6px;color:var(--green);margin:20px 0}.bigscore small{font-size:34px;color:var(--muted);letter-spacing:-1px}.bignum{font-size:90px;font-weight:900;line-height:1.2;color:var(--orange);margin:10px 0}.rule{font-size:14px;color:var(--muted);margin-bottom:20px}.challenge{background:#f3edda;border-radius:14px;padding:19px;margin-top:20px;font-size:18px;font-weight:700}.selectrow{display:flex;gap:10px;justify-content:center;margin:25px 0}.num{width:52px;height:52px;border:1.5px solid var(--line);background:var(--white);border-radius:12px;font-size:20px;font-weight:800}.num.selected{background:var(--green);color:white;border-color:var(--green)}.hint{font-size:12px;color:var(--muted);margin-top:14px}.review{border-bottom:1px solid var(--line);padding:18px 0}.review p{font-size:14px;margin:6px 0}.review strong{font-size:15px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 18px;border-radius:12px;max-width:90%;z-index:20;font-size:13px}.hidden{display:none!important}dialog{border:1px solid var(--line);border-radius:20px;background:var(--bg);max-width:360px;width:calc(100% - 40px);padding:24px;color:var(--ink)}dialog::backdrop{background:#20251e88}.recap{font-size:13px;margin-top:20px}.recap summary{cursor:pointer;padding:10px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){header{padding:15px 20px}.topnote{font-size:9px;letter-spacing:1px}.toptools{gap:9px}main{padding:28px 20px}.hero{grid-template-columns:1fr;gap:0;margin-bottom:24px}.art{display:none}h1{font-size:56px;letter-spacing:-2.5px}.hero p{font-size:15px;max-width:290px;margin-bottom:0}.kicker{margin-bottom:20px}.modegrid{grid-template-columns:1fr;gap:16px}.mode{padding:20px;display:grid;grid-template-columns:42px 1fr;column-gap:14px}.mode .emoji{grid-column:1;grid-row:1/5;font-size:28px}.mode .meta{margin:0 0 6px;grid-column:2}.mode h3{font-size:23px;grid-column:2;margin-bottom:7px}.mode p{grid-column:2;margin-bottom:14px;font-size:13px}.mode .cta{grid-column:2;font-size:14px}.footline{font-size:10px}.panel{padding:21px}.question{font-size:25px}.buttonrow{flex-wrap:wrap}.buttonrow>*{flex:1;min-width:120px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.booth-settings{display:flex;align-items:center;gap:15px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:22px;background:#ececde}.booth-settings strong{display:block;font-size:14px}.booth-settings .muted{font-size:11px}.round-picks{display:flex;gap:8px}.length,.shuffle-btn{border:1.5px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink);padding:11px 17px;min-height:46px;font-weight:700}.length.selected{background:var(--green);color:white;border-color:var(--green)}.shuffle-btn{margin-left:auto;font-size:12px}.clock{display:flex;align-items:center;justify-content:space-between;position:relative;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:13px 16px;background:#e5ecdF;border-radius:13px;color:var(--green);font-size:12px}.clock strong{font-size:25px;line-height:1.1;font-variant-numeric:tabular-nums}.clocktrack{width:100%;height:4px;background:#cfd9c6;border-radius:10px;overflow:hidden}.clocktrack i{display:block;width:100%;height:100%;background:var(--green);transition:width .1s linear}.clock.urgent{background:#f9e3d8;color:#96361d}.clock.urgent .clocktrack i{background:var(--orange)}@media(max-width:600px){.booth-settings{gap:12px}.round-picks{margin-left:auto}.shuffle-btn{width:100%;margin-left:0}.length{padding:10px 16px}}
</style></head>
<body><header><button class="brand" id="brand" aria-label="Về trang chủ">keeps<span>✳</span></button><div class="toptools"><span class="topnote">Hội chợ · NEU</span><button class="iconbtn" id="fullscreen" aria-label="Bật hoặc tắt toàn màn hình">⛶</button></div></header><main id="app"></main><div id="toast" class="toast hidden" role="status"></div><dialog id="exit"><h3>Về trang đầu?</h3><p class="muted">Lượt đang chơi sẽ kết thúc.</p><button class="primary" id="leave">Về trang đầu</button><button class="secondary" id="stay">Chơi tiếp</button></dialog>
<script>
const Q=[
['"Dự án ma" nghĩa là gì?',['Dự án làm về phim ma','Kế hoạch đặt ra nhưng không thực hiện được','Đồ án có bạn mất tích','Dự án ở nghĩa trang'],1,'Dậy sớm học bài là dự án ma quen thuộc của mọi NEUer.'],
['"Chan nhau đi" nghĩa là gì?',['Chan canh vào cơm','Rủ nhau thách đấu cho vui','Rủ đi tắm','Rủ đi ăn lẩu'],1,'Chan nhau cũng được, nhưng đừng chan trong thư viện.'],
['"Bá khí" thường dùng để làm gì?',['Khen hoặc cà khịa người có thần thái ngầu','Gọi món','Báo thức','Tên một môn học'],0,'Bá khí không giúp qua môn, nhưng giúp qua cổng trường.'],
['Thuyết trình xong, bạn nhờ quay lại cảnh mình đóng laptop rồi bước đi. Bạn đang “farm” gì?',['Tương tác','Thành tích','Hào quang','Độ uy tín'],2,'Bài thuyết trình xong rồi, giờ đến bài đăng.'],
['“Đi học cả ngày, tối về vẫn phải mở quán.” Câu này trong trend game trên Threads thường kể chuyện gì?',['Làm thêm ca tối','Chơi game bán hàng','Bán đồ ăn online','Trực fanpage cửa hàng'],1,'Định giải trí mà khách trong game cũng không cho nghỉ.'],
['Crush thả tim story chụp cả lớp. Bạn bắt đầu chọn nhạc đám cưới. Hội bạn gọi pha này là…',['Hard launch','Lowkey','Ghosting','Delulu'],3,'Trong ảnh còn ba mươi người, mình cứ bình tĩnh.'],
['Có đúng 20.000đ, đăng “đang cân nhắc mua lại chuỗi trà sữa” và cố làm người khác tin là thật. Đây là…',['Phông bạt','Manifest','Flex thành tích','Review đầu tư'],0,'Mua một ly còn phải kiểm tra số dư.'],
['Biết rõ cả nhóm làm bài, vẫn đăng “bài nhóm thì một người làm là đủ” chỉ để kéo người vào chửi. Đây là…',['Spoil','Fact-check','Rage bait','Gatekeep'],2,'Biết bạn sẽ tức nên mới đăng.'],
['“Mệt quá, lại phải đi nhận học bổng.” Nếu đang nói thật, bạn này đang làm gì?',['Xin tư vấn','Flex bằng cách than','Nhắc lịch nhận tiền','Giải thích lý do vắng'],1,'Than một câu, đính kèm luôn thành tích.'],
['Khen quán ngon suốt buổi nhưng ai xin địa chỉ cũng bảo “không nói đâu, sợ đông”. Đây là kiểu…',['Soft launch','FOMO','Lowkey','Gatekeep'],3,'Review đến đây là hết, địa chỉ giữ làm của riêng.'],
['Quán ghi “một cốc 15k, hai cốc chỉ 30k”. Mua hai cốc tiết kiệm được bao nhiêu?',['0đ','5.000đ','10.000đ','15.000đ'],0,'Có chữ “chỉ”, chưa có giảm giá.'],
['Bạn tăng tốc video bài giảng dài 90 phút lên 1,5×, không tua hay dừng. Bao lâu mới học xong?',['45 phút','75 phút','60 phút','135 phút'],2,'90 ÷ 1,5 = 60 phút. Giảng viên nói nhanh hơn, thời lượng còn một tiếng.'],
['Năm người đi ăn, chia đều 300k. Bạn cầm hóa đơn, được miễn phần mình. Bốn người còn lại mỗi người trả bao nhiêu?',['60k','75k','80k','100k'],1,'300 ÷ 4 = 75k. Chưa biết ai rủ đi, nhưng biết ai đang được bao.'],
['Hẹn 8:00. Bạn đến 8:10, cả hội đến 8:20. Theo giờ hẹn, ai đúng giờ?',['Bạn','Cả hội','Ai đến trước thì đúng','Không ai'],3,'Đến sớm nhất hội vẫn có thể là đến muộn.'],
['Voucher giảm 50%, tối đa 20k. Bạn đặt đồ 60k, không phí khác. Thực trả bao nhiêu?',['40k','30k','20k','50k'],0,'Giảm tối đa 20k nên trả 40k. Mắt đọc “50%”, voucher đọc “tối đa”.']
];
const G=[
['Chỉ tay',"Ai có 'dự án ma' nhiều nhất trong nhóm?",'kể dự án ma lớn nhất'],
['Chỉ tay','Ai sẽ trở thành CEO đầu tiên của nhóm?','phát biểu nhận giải 10 giây'],
['Chỉ tay','Ai hay đến lớp ngay phút cuối nhất?','giải thích lý do tệ nhất từng dùng'],
['Chỉ tay','Ai khóc đầu tiên khi xem concert?','kể bài hát gây khóc'],
['Chỉ tay',"Ai 'bá khí' nhất nhóm?",'tạo dáng 3 giây, cả nhóm đồng thanh "Bá khí quá!"'],
['Chọn rồi so','Thầy gọi đúng lúc bạn lướt điện thoại',['Úp máy xuống','Đứng dậy nói "dạ"','Hỏi lại câu hỏi','Giả vờ đang ghi chép']],
['Chọn rồi so','Gặp người yêu cũ ở căng tin',['Chào rất trưởng thành','Đổi hàng ngay','Kéo bạn đứng chắn','Mua đồ mang về, hôm nay tự nhiên bận']],
['Chọn rồi so','Wi-Fi sập 30 giây trước hạn nộp',['Bật 4G','Hô “ai có mạng?”','Chụp màn hình làm bằng chứng','Gọi tên đứa đang giữ bản cuối']],
['Chọn rồi so','Gửi nhầm tin riêng vào group lớp',['Thu hồi nhanh hơn suy nghĩ','“Xin lỗi, nhầm group”','“Mọi người thấy sao?”','Tắt thông báo, để tương lai xử lý']],
['Chọn rồi so',"Nhóm chat rủ 'cuối năm đi Đà Lạt'",['Gửi 12 homestay','“Chốt ngày đi”','Đổi tên nhóm trước','“Đi thật thì gọi”']],
['Họp báo khẩn','Nhóm bạn lập group du lịch được tám tháng. Thành tựu duy nhất: đổi ảnh đại diện ba lần. Hãy họp báo.','Một người làm trưởng ban, phát biểu 10 giây. Những người còn lại mỗi người hỏi một câu. Cố giữ mặt nghiêm nhé.'],
['Phỏng vấn tuyển dụng','Bạn ghi trong CV: “Có kinh nghiệm điều hành ba cơ sở F&B.” Thực tế là ba game bán đồ ăn.','Một người ứng tuyển, cả nhóm làm hội đồng. Hỏi: “Em xử lý khách đông thế nào?” Trả lời trong 10 giây, không được nói dối thêm.'],
['Điều tra “sắp tới”','Một người đóng vai đứa nhắn “năm phút nữa tới” nhưng thực tế đang nằm trên giường.','Cả nhóm bàn ba câu hỏi rồi hỏi. Người kia trả lời thật nhưng tìm cách để mọi người vẫn tưởng mình sắp tới.'],
['Cứu một pha mất aura','Bạn vẫy tay với người đang vẫy… đứa phía sau. Cả nhóm có 20 giây cứu pha này.','Chốt một hành động tiếp theo. Một người diễn từ lúc vẫy nhầm đến lúc xử lý xong.'],
['Viết lời khai','Cả nhóm ăn hết đồ ăn vặt của bạn cùng phòng. Trên bàn còn mỗi vỏ. Hãy viết lời giải thích.','Tối đa 15 từ. Không dùng “đói”, “ngon”, “xin lỗi”. Bàn trong 20 giây rồi một người đọc nguyên văn.']
];

const app=document.getElementById('app');
let mode='home',deck=[],pos=0,score=0,locked=false,history=[],players=3,groupDeck=[],gp=0,revealed=false,timer=null,countTimer=null,deadline=0,roundLength=2,roundSize=2,soloBag=[],groupBag=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function save(){try{localStorage.setItem('keeps-booth-v2',JSON.stringify({roundLength,soloBag,groupBag}))}catch(e){}}
try{const saved=JSON.parse(localStorage.getItem('keeps-booth-v2')||'null');if(saved){roundLength=saved.roundLength===1?1:2;const valid=(a,n)=>Array.isArray(a)&&new Set(a).size===a.length&&a.every(x=>Number.isInteger(x)&&x>=0&&x<n);if(valid(saved.soloBag,Q.length))soloBag=saved.soloBag;if(valid(saved.groupBag,G.length))groupBag=saved.groupBag}}catch(e){}
function draw(kind,n){const source=kind==='solo'?Q:G;let bag=kind==='solo'?soloBag:groupBag;const ids=[];while(ids.length<n){if(!bag.length)bag=shuffle(source.map((_,i)=>i));const eligible=bag.findIndex(id=>!ids.includes(id));if(eligible<0)throw Error('Không đủ câu hỏi');ids.push(bag.splice(eligible,1)[0])}if(kind==='solo')soloBag=bag;else groupBag=bag;save();return ids}
function clearTimer(){clearInterval(timer);clearInterval(countTimer);timer=null;countTimer=null;deadline=0}
function render(html){app.innerHTML=html;window.scrollTo(0,0)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}
function home(){clearTimer();mode='home';render(`<section class="hero"><div><div class="kicker"><span class="dot"></span>Trạm nạp tiếng cười</div><h1>Đi hội chợ.<br>Ghé đây <span class="scribble">quậy.</span></h1><p class="muted">Chơi nhanh một lượt.<br>20 giây mỗi câu. Tới công chuyện.</p></div><div class="art" aria-hidden="true"><span class="sticker">20s · não đang tải…</span><div class="frame"><div class="frameface">☺</div><small>GOOD TIMES, KEEPS.</small></div><span class="sticker two">+1000 aura ✦</span></div></section><section class="booth-settings" aria-label="Cài đặt lượt chơi"><div><strong>Mỗi lượt</strong><span class="muted">Chọn trước khi bắt đầu</span></div><div class="round-picks">${[1,2].map(n=>`<button class="length ${roundLength===n?'selected':''}" data-length="${n}" aria-pressed="${roundLength===n}">${n} câu</button>`).join('')}</div><button class="shuffle-btn" id="shuffle">⤨ Xáo bộ câu</button></section><div class="modegrid"><button class="mode" id="solo"><span class="emoji">✳</span><span class="meta">01 / Solo · ${roundLength*20}s trả lời</span><h3>Mạng này mình thuộc.</h3><p>${roundLength} câu bốc ngẫu nhiên. Câu hỏi và đáp án đều được xáo.</p><span class="cta">Chơi một mình <span class="arrow">↗</span></span></button><button class="mode green" id="friends"><span class="emoji">☻</span><span class="meta">02 / Hội bạn · 2–5 người</span><h3>Hội này hơi bất ổn.</h3><p>${roundLength} thẻ mỗi lượt. 20 giây một thẻ, cả hội cùng quậy.</p><span class="cta">Kéo hội vào chơi <span class="arrow">↗</span></span></button></div><div class="footline"><span>Xáo tự động · Hết bộ mới bốc lại</span><span>Chơi vui tại Keeps ✳</span></div>`);document.querySelectorAll('[data-length]').forEach(b=>b.onclick=()=>{roundLength=Number(b.dataset.length);save();home()});document.getElementById('shuffle').onclick=()=>{soloBag=shuffle(Q.map((_,i)=>i));groupBag=shuffle(G.map((_,i)=>i));save();toast('Đã xáo cả hai bộ. Người tiếp theo lên nào!')};document.getElementById('solo').onclick=startSolo;document.getElementById('friends').onclick=groupSetup}
function head(label,n,total){return `<div class="playhead"><button class="textbtn" id="back">← Trang đầu</button><span>${label} · ${n}/${total}</span></div><div class="progress"><i style="width:${n/total*100}%"></i></div>`}
function clockHTML(){return '<div class="clock" id="clockwrap"><span>Thời gian còn lại</span><strong role="timer" id="timeleft">20s</strong><div class="clocktrack"><i id="clockfill"></i></div></div>'}
function beginClock(expire){clearTimer();deadline=Date.now()+20000;const update=()=>{const remaining=Math.max(0,deadline-Date.now()),el=document.getElementById('timeleft');if(!el)return;el.textContent=Math.ceil(remaining/1000)+'s';document.getElementById('clockfill').style.width=(remaining/200)+'%';document.getElementById('clockwrap').classList.toggle('urgent',remaining<=5000);if(!remaining){clearTimer();expire()}};update();timer=setInterval(update,100)}
function bindBack(){document.getElementById('back').onclick=askExit}
function askExit(){if(mode==='home')return;document.getElementById('exit').showModal()}
function startSolo(){clearTimer();mode='solo';score=0;pos=0;history=[];roundSize=roundLength;deck=draw('solo',roundSize).map(id=>({id,q:Q[id],opts:shuffle(Q[id][1].map((s,i)=>({s,i})))}));soloCard()}
function soloCard(){locked=false;const d=deck[pos];render(`<section class="play">${head('SOLO',pos+1,deck.length)}${clockHTML()}<span class="tag">Chọn một đáp án · 20 giây</span><h2 class="question">${esc(d.q[0])}</h2><div class="answers">${d.opts.map((o,i)=>`<button class="answer" data-opt="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o.s)}</span></button>`).join('')}</div><div id="response" aria-live="polite"></div></section>`);bindBack();document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.opt)));beginClock(()=>answer(null,true))}
function answer(selected,timedOut=false){if(locked||mode!=='solo')return;if(!timedOut&&deadline&&Date.now()>=deadline){answer(null,true);return}locked=true;clearTimer();const d=deck[pos],chosen=timedOut?null:d.opts[selected],correct=!!chosen&&chosen.i===d.q[2];if(correct)score++;history.push({d,chosen,correct,timedOut});if(timedOut)document.getElementById('timeleft').textContent='0s';document.querySelectorAll('[data-opt]').forEach((b,i)=>{b.disabled=true;if(d.opts[i].i===d.q[2])b.classList.add('right');else if(i===selected)b.classList.add('wrong')});document.getElementById('response').innerHTML=`<div class="feedback ${correct?'':'bad'}"><strong>${timedOut?'⏱ Hết 20 giây!':correct?'✓ Chuẩn rồi!':'↳ Chưa đúng rồi'}</strong><p>${correct?'':'Đáp án: '+esc(d.q[1][d.q[2]])+'. '}${esc(d.q[3])}</p></div><button class="primary" id="next">${pos===deck.length-1?'Xem kết quả ✦':'Câu tiếp theo · 20s →'}</button>`;document.getElementById('next').onclick=()=>{pos++;if(pos===deck.length)soloResult();else soloCard()};document.getElementById('next').focus({preventScroll:true})}
function soloResult(){clearTimer();mode='result';const total=deck.length,title=score===total?'Bá khí thật, không diễn.':score?'Có lướt, có quên.':'Thuật toán chưa đưa bài.';render(`<section class="play"><div class="panel center"><span class="tag">Xong lượt · ${total} câu</span><div class="bigscore">${score}<small>/${total}</small></div><h2>${title}</h2><p class="muted">Đúng ${score}/${total}. Mời người tiếp theo!</p><button class="primary" id="again">Người tiếp theo · Bốc câu mới ⤨</button><button class="secondary" id="group">Rủ hội bạn chơi →</button><button class="textbtn" id="copy">Sao chép kết quả</button></div><details class="recap"><summary>Xem lại ${total} câu vừa chơi</summary>${history.map((h,i)=>`<div class="review"><strong>${h.correct?'✓':'↳'} ${i+1}. ${esc(h.d.q[0])}</strong><p>Bạn chọn: ${h.chosen?esc(h.chosen.s):'Hết giờ, chưa chọn'}</p><p>Đáp án: <b>${esc(h.d.q[1][h.d.q[2]])}</b></p><p class="muted">${esc(h.d.q[3])}</p></div>`).join('')}</details><button class="secondary" id="mainmenu">← Đổi chế độ / số câu</button></section>`);document.getElementById('again').onclick=startSolo;document.getElementById('group').onclick=groupSetup;document.getElementById('mainmenu').onclick=home;document.getElementById('copy').onclick=async()=>{const s=`Mình đúng ${score}/${total} ở Keeps, 20 giây mỗi câu. ${title}`;try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(s);toast('Đã sao chép kết quả!')}catch(e){toast(s)}}}
function groupSetup(){clearTimer();mode='setup';render(`<section class="play">${head('HỘI BẠN',0,roundLength)}<div class="panel center"><div class="emoji">☻ ☻ ☻</div><h2 style="margin-top:20px">Hôm nay có mấy đứa?</h2><p class="muted">${roundLength} thẻ mỗi lượt · 20 giây mỗi thẻ.<br>Không có đúng sai.</p><div class="selectrow">${[2,3,4,5].map(n=>`<button class="num ${players===n?'selected':''}" data-count="${n}" aria-pressed="${players===n}">${n}</button>`).join('')}</div><p class="rule">Chỉ tay: ai nhiều phiếu nhất nhận thử thách.<br>Hòa thì cùng làm. Ngại thì bỏ qua.</p><button class="primary" id="startGroup">Đủ hội rồi, bắt đầu →</button></div></section>`);bindBack();document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{players=Number(b.dataset.count);groupSetup()});document.getElementById('startGroup').onclick=startGroup}
function startGroup(){clearTimer();roundSize=roundLength;groupDeck=draw('group',roundSize).map(id=>{const g=G[id];return Array.isArray(g[2])?[g[0],g[1],shuffle(g[2])]:g});gp=0;mode='group';groupCard()}
function groupCard(){clearTimer();revealed=false;const g=groupDeck[gp];render(`<section class="play">${head('HỘI '+players+' NGƯỜI',gp+1,groupDeck.length)}${clockHTML()}<div class="panel"><span class="tag">${esc(g[0])}</span><h2 class="question">${esc(g[1])}</h2><div id="groupbody"></div></div><p id="groupstatus" class="hint center" aria-live="polite"></p><button class="primary" id="gnext">${gp===groupDeck.length-1?'Xong lượt này ✦':'Thẻ tiếp theo · 20s →'}</button><button class="textbtn" id="skip">Bỏ qua thẻ này</button><p class="hint center">Không cần kể chuyện riêng nếu bạn không muốn.</p></section>`);bindBack();const body=document.getElementById('groupbody');if(g[0]==='Chỉ tay'){body.innerHTML='<p class="muted">Đọc câu hỏi cho cả hội. Đếm ba rồi cùng chỉ!</p><div id="countdown" class="center" aria-live="polite"></div><button class="secondary" id="count">Sẵn sàng · Đếm 3, 2, 1</button>'}else if(Array.isArray(g[2])){body.innerHTML=`<div class="answers">${g[2].map((s,i)=>`<div class="answer"><span class="letter">${'ABCD'[i]}</span><span>${esc(s)}</span></div>`).join('')}</div><p class="hint">Mỗi người chọn trong đầu. Chưa nói vội!</p><div id="countdown" class="center" aria-live="polite"></div><button class="secondary" id="count">Đếm rồi cùng bật đáp án</button>`}else{revealed=true;body.innerHTML=`<div class="challenge">${esc(g[2])}</div><p class="hint">Cả hội bắt đầu luôn, đồng hồ đang chạy!</p>`}if(document.getElementById('count'))document.getElementById('count').onclick=countdown;document.getElementById('gnext').disabled=!revealed;document.getElementById('gnext').onclick=advanceGroup;document.getElementById('skip').onclick=advanceGroup;beginClock(()=>{document.getElementById('timeleft').textContent='0s';if(!revealed)revealGroup();document.getElementById('groupstatus').textContent='⏱ Hết 20 giây! Chốt màn này rồi sang lượt tiếp theo.';document.getElementById('gnext').disabled=false})}
function revealGroup(){clearInterval(countTimer);countTimer=null;if(revealed)return;revealed=true;const g=groupDeck[gp],area=document.getElementById('countdown'),btn=document.getElementById('count');if(area)area.innerHTML=g[0]==='Chỉ tay'?`<div class="challenge">Chỉ ngay! ☞<br><small>Người nhiều phiếu nhất: ${esc(g[2])}.</small></div>`:'<div class="challenge">A, B, C hay D?<br><small>Cùng nói đáp án nào!</small></div>';if(btn)btn.classList.add('hidden');document.getElementById('gnext').disabled=false}
function countdown(){if(countTimer||revealed)return;if(deadline&&Date.now()>=deadline){revealGroup();return}const btn=document.getElementById('count');btn.disabled=true;let n=3;document.getElementById('countdown').innerHTML='<div class="bignum">3</div>';countTimer=setInterval(()=>{n--;if(n>0)document.getElementById('countdown').innerHTML=`<div class="bignum">${n}</div>`;else revealGroup()},850)}
function advanceGroup(){clearTimer();gp++;if(gp<groupDeck.length)groupCard();else groupResult()}
function groupResult(){clearTimer();mode='result';render(`<section class="play"><div class="panel center"><div class="emoji">✦ ☻ ✦</div><h2 style="margin-top:22px">Hội này giữ lại chơi tiếp.</h2><p class="muted">Vừa đi qua ${groupDeck.length} thẻ.<br>Mời hội tiếp theo lên sóng.</p><button class="primary" id="more">Hội tiếp theo · Bốc thẻ mới ⤨</button><button class="secondary" id="tosolo">Giờ thử chơi solo →</button><button class="textbtn" id="ghome">← Đổi chế độ / số câu</button></div></section>`);document.getElementById('more').onclick=startGroup;document.getElementById('tosolo').onclick=startSolo;document.getElementById('ghome').onclick=home}
document.getElementById('brand').onclick=()=>mode==='home'?home():askExit();document.getElementById('stay').onclick=()=>document.getElementById('exit').close();document.getElementById('leave').onclick=()=>{document.getElementById('exit').close();home()};document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Trình duyệt này chưa hỗ trợ toàn màn hình.')}catch(e){toast('Bạn có thể mở toàn màn hình từ menu trình duyệt.')}};home();
</script></body></html>
